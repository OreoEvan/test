name: Daily Research Agent

on:
  schedule:
    # UTC 时间每天 1:00 对应北京时间 9:00
    - cron: '0 1 * * *'
  workflow_dispatch:  # 允许手动触发

jobs:
  research:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          persist-credentials: false   # 避免默认GITHUB_TOKEN权限问题

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install openai ddgs

      - name: Run research script
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: python auto_report.py

      - name: Commit and push report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add reports/
          git diff --staged --quiet || git commit -m "Auto-generated research report"
          git push